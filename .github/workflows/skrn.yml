name: Render
# One click, nothing required to fill in: media is auto-picked from the
# images folder each run, duration is a random 1-3hr, size targets
# 1.0-1.9GB. Override any of the inputs below only if you want to.
on:
  workflow_dispatch:
    inputs:
      media_name:
        description: "Optional: exact filename to force this run to use. Leave blank to auto-pick."
        required: false
        type: string
      duration_seconds:
        description: "Optional: video length in seconds. Leave blank for a random 1-3hr."
        required: false
        type: string
      channel_tag:
        description: "Short tag if you run more than one distinct channel"
        required: false
        type: string
        default: "render"
      images_folder_id:
        description: "Google Drive folder ID for background images"
        required: false
        type: string
        default: "1bbYxw2pNbVS05liS0pObjxevuJ-BdXck"
      songs_folder_id:
        description: "Google Drive folder ID for songs"
        required: false
        type: string
        default: "1DILwSnl-m4yY2w5J29hIlv19DnzNzVm_"
      sub_file_id:
        description: "Google Drive file ID for the green-screen subscribe clip"
        required: false
        type: string
        default: "1PsqVZyJZbyy8oh5LQoKkgms7bGkkJquY"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          docker system prune -af || true
          df -h
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg --fix-missing
          pip install gdown --break-system-packages
      - name: Run render
        id: render
        env:
          TARGET_MEDIA_NAME: ${{ inputs.media_name }}
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
          CHANNEL_TAG: ${{ inputs.channel_tag }}
          IMAGES_FOLDER_ID: ${{ inputs.images_folder_id }}
          SONGS_FOLDER_ID: ${{ inputs.songs_folder_id }}
          SUB_FILE_ID: ${{ inputs.sub_file_id }}
          LOGO_PATH: ${{ github.workspace }}/assets/logo.png
          TARGET_SIZE_GB: "1.5"
          ZOOM_MIN: "1.0"
          ZOOM_MAX: "1.15"
          SUB_MAX_SHOW_SECONDS: "6"
        run: python render.py
      - name: Upload asset manifest as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-manifest
          path: asset_manifest.csv
          if-no-files-found: warn
      - name: Tag release
        id: tag
        run: |
          TS=$(date -u +"%Y%m%d_%H%M%S")
          echo "tag=${{ inputs.channel_tag }}_${TS}" >> $GITHUB_OUTPUT
          echo "title=${{ inputs.channel_tag }} ${TS} -- ${{ steps.render.outputs.media_name }}" >> $GITHUB_OUTPUT
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "${{ steps.tag.outputs.title }}"
          body: |
            Source: ${{ steps.render.outputs.media_name }}
            Duration: ${{ steps.render.outputs.duration_seconds }}s
            Size: ${{ steps.render.outputs.final_size_mb }} MB
            A thumbnail image is attached alongside the video so you can
            tell releases apart at a glance.
            Before publishing to YouTube:
            - Toggle "Altered or synthetic content" in Studio if applicable
            - Write a unique title/description/thumbnail for this upload
            - Check asset_manifest.csv for this video's licensing sources
          files: |
            ${{ steps.render.outputs.output_path }}
            ${{ steps.render.outputs.thumb_path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
