name: Render

# Deliberately manual — you pick the source file per run instead of
# auto-fanning across an entire folder. That "one script -> N near-identical
# outputs" pattern is exactly what YouTube's inauthentic-content policy
# targets, so this workflow does not do it for you.
on:
  workflow_dispatch:
    inputs:
      media_name:
        description: "Exact filename of the background image/video to use for this run"
        required: true
        type: string
      duration_seconds:
        description: "Video length in seconds (leave blank for a random 1-2hr)"
        required: false
        type: string
      channel_tag:
        description: "Short tag if you run more than one distinct channel (e.g. midnight-drive)"
        required: false
        type: string
        default: "render"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          docker system prune -af || true
          df -h

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg --fix-missing
          pip install gdown --break-system-packages

      - name: Run render
        id: render
        env:
          TARGET_MEDIA_NAME: ${{ inputs.media_name }}
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
          CHANNEL_TAG: ${{ inputs.channel_tag }}
          IMAGES_FOLDER_ID: ${{ secrets.IMAGES_FOLDER_ID }}
          SONGS_FOLDER_ID: ${{ secrets.SONGS_FOLDER_ID }}
          LOGO_PATH: ${{ github.workspace }}/assets/logo.png
        run: python render.py

      - name: Upload asset manifest as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-manifest
          path: asset_manifest.csv
          if-no-files-found: warn

      - name: Tag release
        id: tag
        run: |
          TS=$(date -u +"%Y%m%d_%H%M%S")
          echo "tag=${{ inputs.channel_tag }}_${TS}" >> $GITHUB_OUTPUT
          echo "title=${{ inputs.channel_tag }} ${TS}" >> $GITHUB_OUTPUT

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "${{ steps.tag.outputs.title }}"
          body: |
            Source: ${{ inputs.media_name }}
            Size: ${{ steps.render.outputs.final_size_mb }} MB

            Before publishing to YouTube:
            - Toggle "Altered or synthetic content" in Studio if applicable
            - Write a unique title/description/thumbnail for this upload
            - Check asset_manifest.csv for this video's licensing sources
          files: ${{ steps.render.outputs.output_path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
