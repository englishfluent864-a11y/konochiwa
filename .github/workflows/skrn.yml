name: Render
# No inputs, no fields, nothing to fill in. Click "Run workflow" and every
# step below runs back-to-back automatically: download images/songs/sub
# clip, auto-pick a background, render, generate a thumbnail, publish a
# release. All config (folder IDs, channel tag, size/zoom/sub settings)
# lives in render.py -- edit it there if you need to change anything.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          docker system prune -af || true
          df -h
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg --fix-missing
          pip install gdown --break-system-packages
      - name: Run render
        id: render
        run: python render.py
      - name: Upload asset manifest as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-manifest
          path: asset_manifest.csv
          if-no-files-found: warn
      - name: Tag release
        id: tag
        run: |
          TS=$(date -u +"%Y%m%d_%H%M%S")
          echo "tag=render_${TS}" >> $GITHUB_OUTPUT
          echo "title=render ${TS} -- ${{ steps.render.outputs.media_name }}" >> $GITHUB_OUTPUT
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "${{ steps.tag.outputs.title }}"
          body: |
            Source: ${{ steps.render.outputs.media_name }}
            Duration: ${{ steps.render.outputs.duration_seconds }}s
            Size: ${{ steps.render.outputs.final_size_mb }} MB
            A thumbnail image is attached alongside the video so you can
            tell releases apart at a glance.
            Before publishing to YouTube:
            - Toggle "Altered or synthetic content" in Studio if applicable
            - Write a unique title/description/thumbnail for this upload
            - Check asset_manifest.csv for this video's licensing sources
          files: |
            ${{ steps.render.outputs.output_path }}
            ${{ steps.render.outputs.thumb_path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
